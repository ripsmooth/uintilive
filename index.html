<!doctype html>
<html lang="fi">
<head><meta charset="utf-8"><style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  padding:0;
  background:transparent;
  overflow:hidden;
  font-family:Arial,sans-serif;
  color:#fff;
}
#p{
  width:100%;
  max-width:100%;
  min-height:0;
  background:rgba(0,0,0,.82);
  border-radius:clamp(4px,.7vmin,8px);
  padding:clamp(2px,.35vmin,4px) clamp(7px,1.2vmin,12px);
  box-sizing:border-box;
}
#e{
  font-size:clamp(12px,2.1vmin,17px);
  line-height:1.05;
  font-weight:bold;
  display:inline;
}
#h{
  display:inline;
  font-size:clamp(9px,1.5vmin,13px);
  line-height:1.05;
  color:#bbb;
  margin-left:clamp(5px,1vmin,10px);
}
table{
  width:100%;
  border-collapse:collapse;
  table-layout:auto;
  font-size:clamp(13px,2.2vmin,18px);
}
th{
  text-align:left;
  color:#999;
  font-size:clamp(9px,1.5vmin,12px);
  padding:0 clamp(3px,.6vmin,5px) 1px;
  white-space:nowrap;
}
td{
  padding:clamp(1px,.18vmin,2px) clamp(3px,.6vmin,5px);
  border-top:1px solid rgba(255,255,255,.12);
  line-height:1.05;
}
.l{
  width:6%;
  text-align:center;
  font-weight:bold;
  font-size:clamp(12px,2.1vmin,17px);
}
.name{
  font-size:clamp(13px,2.2vmin,18px);
  font-weight:600;
  white-space:nowrap;
}
.t{
  text-align:right;
  width:21%;
  font-weight:500;
  white-space:nowrap;
}
.rank{
  width:7%;
  text-align:center;
  color:#999;
  font-size:clamp(8px,1.3vmin,11px);
}
.rankcell{
  text-align:center;
  font-weight:800;
  width:8%;
}
.c{
  color:#bbb;
  font-size:clamp(9px,1.5vmin,12px);
}
.split{
  display:inline;
  color:#fff;
  font-size:clamp(11px,1.8vmin,15px);
  font-weight:500;
  line-height:1;
}
.final{
  display:inline;
  color:#39d353;
  font-size:clamp(12px,2.1vmin,17px);
  font-weight:800;
  line-height:1;
}
#s{
  display:none;
}
.err{color:#ff8a8a}
</style></head>
<body>
<div id="p">
  <div id="e">Swimify</div>
  <div id="h">Etsitään käynnissä olevaa erää…</div>
  <table><thead><tr>
    <th class="l">Rata</th><th>Uimari</th><th>Seura</th><th class="t">Aika</th><th class="rank">Sija</th>
  </tr></thead><tbody id="r"></tbody></table>
  <div id="s">Yhdistetään…</div>
</div>
<script>
const API_BASE='https://uintilive.vercel.app/';
const competitionFromUrl=new URLSearchParams(window.location.search).get('competition');

function x(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function draw(h) {
  const e=h?.time_program_entry?.round?.event;
  document.querySelector('#e').textContent=(e?.name || 'Swimify') + (e?.number ? ' #' + e.number : '');
  document.querySelector('#h').textContent=(h?.name || 'Erä') + (h?.number ? ' - Erä ' + h.number : '');

  document.querySelector('#r').innerHTML=(h?.lanes || []).map(l => {
    const c=l.competitor;
    const n=c ? (c.full_name || [c.first_name,c.last_name].filter(Boolean).join(' ') || '—') : '—';
    const club=c ? (c.club?.short_name || c.club?.name || c.country_code || '') : '';
    let final=l.result_text || '';
    if(l.dns) final='DNS';
    else if(l.dnf) final='DNF';
    else if(l.dsq) final='DSQ';

    const subs=Array.isArray(l.sub_results)
      ? l.sub_results.filter(z => z && ((z.result_value_text != null && z.result_value_text !== '') || (z.split_diff_text != null && z.split_diff_text !== '')))
      : [];

    let splitHtml='';
    if(c && !l.dns && !l.dnf && !l.dsq && subs.length) {
      const z=subs[subs.length-1];
      const tm=z.result_value_text || z.split_diff_text || '';
      const ord=Number.isFinite(Number(z.order)) ? Number(z.order) : subs.length;
      const dist=50*ord;
      splitHtml=`<span class="split">${x(tm)} (${dist}m)</span>`;
    }

    const rank=(c && l.heat_rank != null && l.heat_rank !== '' && !l.dns && !l.dnf && !l.dsq) ? l.heat_rank : '';

    return `<tr>
      <td class="l">${x(l.number)}</td>
      <td>${x(n)}</td>
      <td class="c">${x(club)}</td>
      <td class="t">${splitHtml}<span class="final">${x(final)}</span></td>
      <td class="rankcell">${x(rank)}</td>
    </tr>`;
  }).join('');
}

async function go() {
  const s=document.querySelector('#s');
  try {
    const base=API_BASE.replace(/\/+$/, '');
    const q=competitionFromUrl
      ? 'competition=' + encodeURIComponent(competitionFromUrl) + '&'
      : '';
    const r=await fetch(base + '/api/data?' + q + Date.now(), {cache:'no-store'});
    const d=await r.json();
    if(!d.ok) throw Error(d.error || 'Tuntematon API-virhe');
    if(!d.heat) {
      document.querySelector('#h').textContent='Ei käynnissä olevaa erää';
      document.querySelector('#r').innerHTML='';
      s.textContent=d.message || 'Odotetaan erää…';
      return;
    }
    draw(d.heat);
    s.textContent='';
  } catch(e) {
    document.querySelector('#h').textContent='Swimify-yhteys: ' + (e.message || e);
    document.querySelector('#r').innerHTML='';
  }
}

go();
setInterval(go,1000);
</script>
</body></html>
