<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swimify TV</title>
<style>
html,body{width:100%;height:100%;margin:0;padding:0;background:transparent;overflow:hidden;font-family:Arial,sans-serif;color:#fff}#p{width:100%;max-width:100%;min-height:100%;background:rgba(0,0,0,.80);border-radius:clamp(8px,1.4vmin,14px);padding:clamp(8px,2vmin,16px) clamp(10px,2.5vmin,20px);box-sizing:border-box}#e{font-size:clamp(18px,3.5vmin,28px);line-height:1.15;font-weight:bold}#h{font-size:clamp(13px,2.5vmin,20px);line-height:1.2;color:#ddd;margin:clamp(3px,.7vmin,4px) 0 clamp(7px,1.5vmin,12px)}table{width:100%;border-collapse:collapse;table-layout:auto;font-size:clamp(16px,3.2vmin,25px)}th{text-align:left;color:#aaa;font-size:clamp(10px,1.9vmin,15px);padding:clamp(3px,.7vmin,5px) clamp(4px,1vmin,8px);white-space:nowrap}td{padding:clamp(4px,1.1vmin,7px) clamp(4px,1vmin,8px);border-top:1px solid rgba(255,255,255,.12)}.l{width:7%;text-align:center;font-weight:bold}.t{text-align:right;width:18%;font-weight:bold;white-space:nowrap}.rank{width:8%;text-align:center;color:#aaa;font-size:clamp(10px,1.9vmin,15px)}.rankcell{text-align:center;font-weight:800;width:8%}.c{color:#bbb;font-size:clamp(11px,2.2vmin,18px)}.split{display:block;color:#ddd;font-size:clamp(10px,1.9vmin,15px);font-weight:500;line-height:1.35}.final{display:block;color:#39d353;font-size:clamp(13px,2.6vmin,21px);font-weight:800;line-height:1.35}#s{font-size:clamp(9px,1.8vmin,14px);color:#aaa;margin-top:clamp(5px,1.2vmin,10px)}.err{color:#ff8a8a}
</style></head><body><div id="p"><div id="e">Swimify</div><div id="h">Etsitään käynnissä olevaa erää…</div><table><thead><tr><th class="l">Rata</th><th>Uimari</th><th>Seura</th><th class="t">Aika</th><th class="rank">Sija</th></tr></thead><tbody id="r"></tbody></table><div id="s">Yhdistetään…</div></div>
<script>
// VAIHDA tähän Vercel-proxysi osoite, esim. https://swimify-proxy-xxxxx.vercel.app
const API_BASE='https://uintilive.vercel.app';
function x(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function draw(h){const e=h?.time_program_entry?.round?.event;document.querySelector('#e').textContent=(e?.name||'Swimify')+(e?.number?' #'+e.number:'');document.querySelector('#h').textContent=(h?.name||'Erä')+(h?.number?' - Erä '+h.number:'');document.querySelector('#r').innerHTML=(h?.lanes||[]).map(l=>{const c=l.competitor||{},n=c.full_name||[c.first_name,c.last_name].filter(Boolean).join(' ')||'—';const club=c.club?.short_name||c.club?.name||c.country_code||'';let final=l.result_text||l.entry_time_text||'';if(l.dns)final='DNS';else if(l.dnf)final='DNF';else if(l.dsq)final='DSQ';const subs=Array.isArray(l.sub_results)?l.sub_results.filter(z=>z&&((z.result_value_text!=null&&z.result_value_text!=='')||(z.split_diff_text!=null&&z.split_diff_text!==''))):[];let splitHtml='';if(!l.dns&&!l.dnf&&!l.dsq&&subs.length){const z=subs[subs.length-1];const tm=z.result_value_text||z.split_diff_text||'';const ord=Number.isFinite(Number(z.order))?Number(z.order):subs.length;const dist=50*ord;splitHtml=`<span class="split">${x(tm)} (${dist}m)</span>`;}const rank=(l.heat_rank!=null&&l.heat_rank!==''&&!l.dns&&!l.dnf&&!l.dsq)?l.heat_rank:'—';return `<tr><td class="l">${x(l.number)}</td><td>${x(n)}</td><td class="c">${x(club)}</td><td class="t">${splitHtml}<span class="final">${x(final)}</span></td><td class="rankcell">${x(rank)}</td></tr>`}).join('');}
async function go(){const s=document.querySelector('#s');try{if(API_BASE.includes('VAIHDA-TAMA'))throw Error('Aseta ensin Vercel-proxyn osoite index.html-tiedoston API_BASE-kohtaan.');const r=await fetch(API_BASE+'/api/data?'+Date.now(),{cache:'no-store'});const d=await r.json();if(!d.ok)throw Error(d.error);if(!d.heat){document.querySelector('#h').textContent='Ei käynnissä olevaa erää';document.querySelector('#r').innerHTML='';s.textContent=d.message||'Odotetaan erää…';return}draw(d.heat);s.textContent='Swimify-yhteys OK - automaattinen eräseuranta - '+new Date().toLocaleTimeString('fi-FI');s.className='';}catch(e){s.textContent='Swimify-yhteys: '+e.message;s.className='err';}}go();setInterval(go,1000);
</script></body></html>
